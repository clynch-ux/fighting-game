<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <title>Pixel Clash — Choose Your Fighter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell menu-shell">
    <header class="brand">
      <p class="eyebrow">RETRO ARCADE FIGHTER</p>
      <h1>PIXEL <span>CLASH</span></h1>
      <p class="subtitle">Choose your fighter. Step into the arena. Make your move.</p>
    </header>

    <section class="selection-panel" aria-labelledby="choose-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PLAYER 1</p>
          <h2 id="choose-title">Choose your character</h2>
        </div>
        <p class="keyboard-hint">Use the cards to see each fighter's stats</p>
      </div>
      <div id="character-roster" class="character-roster" aria-label="Available fighters"></div>
    </section>

    <section class="matchup" aria-live="polite">
      <div class="matchup-fighter">
        <span class="matchup-label">YOUR FIGHTER</span>
        <strong id="selected-name">Swift</strong>
      </div>
      <span class="versus">VS</span>
      <div class="matchup-fighter opponent-preview">
        <span class="matchup-label">RANDOM CPU OPPONENT</span>
        <strong id="opponent-name">Titan</strong>
      </div>
    </section>

    <button id="fight-button" class="button button-primary" type="button">FIGHT <span aria-hidden="true">→</span></button>
    <p class="menu-note">The CPU fighter is chosen at random when you enter the arena.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
