<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Clash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pixel Clash</h1>

      <section class="selection" aria-label="Character selection">
        <article class="character-card player-card">
          <label for="player-choice">Player 1 character</label>
          <select id="player-choice"></select>
          <div id="player-stats" class="stats"></div>
        </article>
        <article class="character-card cpu-card">
          <label for="cpu-choice">CPU character</label>
          <select id="cpu-choice"></select>
          <div id="cpu-stats" class="stats"></div>
        </article>
      </section>

      <section class="hud" aria-label="Fight status">
        <div class="fighter-info">
          <span id="player-name" class="name">Player 1</span>
          <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
        </div>
        <div class="center-panel">
          <div id="timer">60</div>
          <div id="status" aria-live="polite">FIGHT!</div>
        </div>
        <div class="fighter-info right">
          <span id="cpu-name" class="name">CPU</span>
          <div class="health-bar"><div id="p2-health" class="health-fill enemy"></div></div>
        </div>
      </section>

      <canvas id="game" width="960" height="540" aria-label="Fighting game arena"></canvas>

      <section class="controls">
        <p><strong>Move:</strong> A / D &nbsp; <strong>Jump:</strong> W &nbsp; <strong>Attack:</strong> F &nbsp; <strong>Block:</strong> S</p>
        <p><strong>Restart:</strong> R</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
